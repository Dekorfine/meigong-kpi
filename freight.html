<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>昌晖/明扬/正石/澳洲/中东运费精算器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: #f8fafc; }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .animate-bounce-slow { animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(-2%); } 50% { transform: translateY(0); } }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        /* Auto-save indicator */
        .autosave-badge {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 11px; color: #16a34a; font-weight: 500;
            background: #f0fdf4; border: 1px solid #bbf7d0;
            padding: 2px 8px; border-radius: 99px;
        }
        .autosave-badge::before { content: '●'; font-size: 8px; }
        /* nav bar */
        .top-nav {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 16px; background: #1e293b; font-size: 12px;
        }
        .top-nav a { color: #94a3b8; text-decoration: none; }
        .top-nav a:hover { color: #fff; }
        .btn-clear {
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
            color: #94a3b8; padding: 3px 10px; border-radius: 4px;
            font-size: 11px; cursor: pointer; font-family: inherit;
        }
        .btn-clear:hover { background: rgba(255,255,255,0.15); color: #fff; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <!-- Top navigation bar -->
    <div class="top-nav">
        <a href="index.html">← 返回首页</a>
        <span class="autosave-badge" id="autosave-indicator">已自动保存</span>
        <button class="btn-clear" onclick="if(confirm('清空所有输入？')){localStorage.removeItem('freightCalcState_v1');location.reload();}">✕ 清空重算</button>
    </div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;

        // --- 静态常量定义 ---
        const BASE_BUFFER = 2; 
        const CRATE_BUFFER = 5; 
        const YUNDING_LIMIT = 410; 
        const RED_LINE_WEIGHT = 20.0;
        const RED_LINE_LONGEST = 120.0;
        const RED_LINE_SECOND = 75.0;
        const RED_LINE_GIRTH = 260.0;
        const YUNDING_MIN_WEIGHT = 101; 

        const regionLabel = { east: '美东', mid: '美中', west: '美西' };

        const YUNDING_RATES = [
            { match: (z) => /^9[0-2]/.test(z), rates: [9.1, 8.6, 8.1, 7.6, 7, 6.5, 6.3] },
            { match: (z) => { const z3 = z.substring(0,3); return /^9[3-5]/.test(z) || (z3 >= '850' && z3 <= '853') || (z3 >= '890' && z3 <= '893'); }, rates: [13.1, 11.5, 10, 9.1, 8.4, 8.2, 7.9] },
            { match: (z) => { const z2 = z.substring(0,2), z3 = z.substring(0,3); return (z2 >= '84' && z2 <= '89') && !((z3 >= '850' && z3 <= '853') || (z3 >= '890' && z3 <= '893')); }, rates: [13.1, 13.1, 13.2, 11.7, 11.2, 10.9, 9.9] },
            { match: (z) => /^8[0-3]/.test(z), rates: [15.8, 15.3, 14.9, 13.6, 12.1, 11.8, 11.6] },
            { match: (z) => { const z2 = z.substring(0,2), z3 = z.substring(0,3); return (z2 >= '96' && z2 <= '99') && !((z3 >= '966' && z3 <= '969') || (z3 >= '995' && z3 <= '999')); }, rates: [16.2, 15.7, 15.1, 13.7, 13, 12.6, 12.2] },
            { match: (z) => /^7/.test(z), rates: [16.8, 16, 14.8, 13.6, 12.8, 12.3, 12] },
            { match: (z) => /^[4-6]/.test(z), rates: [16.9, 16.4, 15.3, 14.1, 13.2, 12.8, 12.5] },
            { match: (z) => /^[0-3]/.test(z), rates: [18, 17.8, 16.7, 15.2, 14.5, 14.2, 14] }
        ];

        const Icon = ({ name, className = "w-5 h-5" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    iconRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
                    window.lucide.createIcons({ root: iconRef.current });
                }
            }, [name, className]);
            return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
        };

        const App = () => {
            // --- 状态定义 ---
            const [packages, setPackages] = useState([
                { id: Date.now(), l: 36, w: 24, h: 24, weight: 0, qty: 1 }
            ]);
            const [orderQty, setOrderQty] = useState(1);
            const [purchasePrice, setPurchasePrice] = useState('');
            const [exchangeRate, setExchangeRate] = useState(7.2);
            const [useCrate, setUseCrate] = useState(false);
            const [zipCode, setZipCode] = useState(''); 
            const [auZipCode, setAuZipCode] = useState(''); 
            const [caZipCode, setCaZipCode] = useState(''); // 新增加拿大邮编状态

            // ── Auto-save: restore from localStorage on first load ──
            const SAVE_KEY = 'freightCalcState_v1';
            useEffect(() => {
                try {
                    const saved = localStorage.getItem(SAVE_KEY);
                    if (!saved) return;
                    const s = JSON.parse(saved);
                    if (s.packages && s.packages.length > 0) setPackages(s.packages);
                    if (s.orderQty !== undefined) setOrderQty(s.orderQty);
                    if (s.purchasePrice !== undefined) setPurchasePrice(s.purchasePrice);
                    if (s.exchangeRate !== undefined) setExchangeRate(s.exchangeRate);
                    if (s.useCrate !== undefined) setUseCrate(s.useCrate);
                    if (s.zipCode !== undefined) setZipCode(s.zipCode);
                    if (s.auZipCode !== undefined) setAuZipCode(s.auZipCode);
                    if (s.caZipCode !== undefined) setCaZipCode(s.caZipCode);
                } catch(e) {}
            }, []);

            // ── Auto-save: persist on every state change (debounced) ──
            useEffect(() => {
                const timer = setTimeout(() => {
                    try {
                        localStorage.setItem(SAVE_KEY, JSON.stringify({
                            packages, orderQty, purchasePrice, exchangeRate,
                            useCrate, zipCode, auZipCode, caZipCode
                        }));
                    } catch(e) {}
                }, 600);
                return () => clearTimeout(timer);
            }, [packages, orderQty, purchasePrice, exchangeRate, useCrate, zipCode, auZipCode, caZipCode]);

            // --- 动态增删包装 ---
            const addPackage = () => {
                setPackages([...packages, { id: Date.now(), l: 0, w: 0, h: 0, weight: 0, qty: 1 }]);
            };

            const removePackage = (id) => {
                if (packages.length > 1) {
                    setPackages(packages.filter(p => p.id !== id));
                }
            };

            const updatePkgField = (id, field, value) => {
                setPackages(packages.map(p => p.id === id ? { ...p, [field]: parseFloat(value) || 0 } : p));
            };

            // 木箱成本计算
            const calculateCrateCost = (l, w, h) => {
                if (!useCrate) return 0;
                const surfaceArea = (l * w * 2) + (l * h * 2) + (w * h * 2);
                return (surfaceArea / 10000) * 44;
            };

            // 计费核心函数 - 昌晖
            const calcCH = (pkgs, reg, isCrate) => {
                let totalV = 0, totalA = 0;
                let limitEx = false;
                let maxGirthValue = 0;
                let totalBw = 0;
                const isMulti = pkgs.length > 1; // 判断是否大于1件（加班船条件）
                const surMap = {};
                const addSur = (name, cost) => {
                    if (!surMap[name]) surMap[name] = { name, cost: 0, count: 0 };
                    surMap[name].cost += cost;
                    surMap[name].count += 1;
                };

                if (isCrate) {
                    addSur('木箱费 (10元/件)', pkgs.length * 10);
                }

                pkgs.forEach(p => {
                    const sides = [p.l,p.w,p.h].sort((a,b)=>b-a);
                    const girth = sides[0] + 2*(sides[1]+sides[2]);
                    if (girth > maxGirthValue) maxGirthValue = girth;
                    if (girth > YUNDING_LIMIT) limitEx = true;
                    
                    let v = (p.l*p.w*p.h)/6000;
                    let a = p.weight||0;
                    totalV += v; 
                    totalA += a;

                    // 核心：单件计费重，如果是多件(加班船)，每件最低12kg
                    let p_bw = Math.max(v, a);
                    if (isMulti && p_bw < 12) p_bw = 12;
                    totalBw += p_bw;

                    if (p.weight > 22.5) addSur('重量附加费', p.weight >= 40 ? 400 : 100);
                    if (sides[0] > 120) addSur('超长附加费', sides[0] >= 240 ? 910 : 100);
                    if (sides[1] >= 75) addSur('二边超限费', 100);
                    if (girth > 265) addSur('围长附加费', girth > 320 ? 600 : 120);
                });
                const sur = Object.values(surMap);
                
                // 总计费重：多件按单箱限制12kg后的累计重，单件按原始最大值算(最低12kg起收)
                let bw = Math.ceil(isMulti ? totalBw : Math.max(totalV, totalA)); 
                if (bw < 12) bw = 12;
                
                const r = { west:{b:135,e:14,m:19,h:16}, mid:{b:145,e:15,m:20,h:17}, east:{b:165,e:17,m:21,h:18} }[reg];
                let cost = bw >= 101 ? bw*r.h : bw >= 12 ? bw*r.m : r.b + (bw-5)*r.e;
                return { totalCost: cost + sur.reduce((a,b)=>a+b.cost,0), bw, sur, limitEx, maxGirth: maxGirthValue };
            };

            // 计费核心函数 - 昌晖小货海运
            const calcCHSmall = (pkgs, reg, isCrate) => {
                let totalV = 0, totalA = 0;
                let limitEx = false;
                let maxGirthValue = 0;
                let totalBw = 0;
                const isMulti = pkgs.length > 1; // 判断是否大于1件
                const surMap = {};
                const addSur = (name, cost) => {
                    if (!surMap[name]) surMap[name] = { name, cost: 0, count: 0 };
                    surMap[name].cost += cost;
                    surMap[name].count += 1;
                };

                // 核心修改：昌晖小货仅限单件，超过1件直接熔断报错
                if (isMulti) {
                    return { 
                        totalCost: Infinity, 
                        bw: 0, 
                        sur: [{ name: '渠道限制', cost: 0, count: 1 }, { name: '↳ 仅限单件，多件请走加班船', cost: 0, count: 1 }], 
                        limitEx: false, 
                        maxGirth: 0, 
                        isError: true, 
                        errorMsg: '一票多件请发加班船渠道' 
                    };
                }

                if (isCrate) {
                    addSur('木箱费 (10元/件)', pkgs.length * 10);
                }

                pkgs.forEach(p => {
                    const sides = [p.l,p.w,p.h].sort((a,b)=>b-a);
                    const girth = sides[0] + 2*(sides[1]+sides[2]);
                    if (girth > maxGirthValue) maxGirthValue = girth;
                    if (girth > YUNDING_LIMIT) limitEx = true;
                    
                    let v = (p.l*p.w*p.h)/6000;
                    let a = p.weight||0;
                    totalV += v; 
                    totalA += a;

                    // 核心：单件计费重，如果是多件(加班船)，每件最低12kg
                    let p_bw = Math.max(v, a);
                    if (isMulti && p_bw < 12) p_bw = 12;
                    totalBw += p_bw;

                    if (p.weight > 22.5) addSur('重量附加费', p.weight >= 40 ? 400 : 100);
                    if (sides[0] > 120) addSur('超长附加费', sides[0] >= 240 ? 910 : 100);
                    if (sides[1] >= 75) addSur('二边超限费', 100);
                    if (girth > 265) addSur('围长附加费', girth > 320 ? 600 : 120);
                });
                const sur = Object.values(surMap);
                
                // 总计费重
                let bw = Math.ceil(isMulti ? totalBw : Math.max(totalV, totalA)); 
                if (bw < 5) bw = 5;
                
                // 完全按照线性公式计费：首重基准 + (总重-5) * 续重
                const r = { west:{b:135,e:14}, mid:{b:145,e:15}, east:{b:165,e:17} }[reg];
                let cost = r.b + (bw-5)*r.e;
                return { totalCost: cost + sur.reduce((a,b)=>a+b.cost,0), bw, sur, limitEx, maxGirth: maxGirthValue };
            };

            // 计费核心函数 - 明扬
            const calcMY = (pkgs, reg) => {
                let totalV = 0, totalA = 0;
                let limitEx = false;
                let maxGirthValue = 0;
                let totalBw = 0;
                const isMulti = pkgs.length > 1; // 判断是否大于1件（加班船条件）
                const surMap = {};
                const addSur = (name, cost) => {
                    if (!surMap[name]) surMap[name] = { name, cost: 0, count: 0 };
                    surMap[name].cost += cost;
                    surMap[name].count += 1;
                };

                pkgs.forEach(p => {
                    const sides = [p.l,p.w,p.h].sort((a,b)=>b-a);
                    const girth = sides[0] + 2*(sides[1]+sides[2]);
                    if (girth > maxGirthValue) maxGirthValue = girth;
                    if (girth > YUNDING_LIMIT) limitEx = true;
                    
                    let v = (p.l*p.w*p.h)/6000;
                    let a = p.weight||0;
                    totalV += v; 
                    totalA += a;

                    // 核心：单件计费重，如果是多件(加班船)，每件最低12kg
                    let p_bw = Math.max(v, a);
                    if (isMulti && p_bw < 12) p_bw = 12;
                    totalBw += p_bw;

                    if (sides[0] > 120 && sides[0] < 200) addSur('长边120-200cm', 100);
                    else if (sides[0] >= 200) addSur('长边≥200cm', 200);
                    if (sides[1] > 75) addSur('二边>75cm', 100);
                    if (p.weight >= 22) addSur('实重>22kg', 100);
                    if (girth > 266 && girth < 320) addSur('围长266-320cm', 100);
                    else if (girth >= 320) addSur('围长≥320cm', 600);
                });
                
                // 总计费重：多件按单箱限制12kg后的累计重，单件按原始最大值算(最低12kg起收)
                let bw = Math.ceil(isMulti ? totalBw : Math.max(totalV, totalA)); 
                if (bw < 12) bw = 12;
                const sur = Object.values(surMap);

                let baseCost = 0;
                if (bw >= 101) {
                    const heavyRates = { east: 16, mid: 15, west: 14 };
                    baseCost = bw * heavyRates[reg];
                } else if (bw >= 12) {
                    const midRates = { east: 20, mid: 19, west: 14 };
                    baseCost = bw * midRates[reg];
                } else {
                    const configs = { east: { extra: 17, base: 160 }, mid: { extra: 16, base: 150 }, west: { extra: 15, base: 140 } };
                    baseCost = (bw - 5) * configs[reg].extra + configs[reg].base;
                }

                return { totalCost: baseCost + sur.reduce((a,b)=>a+b.cost,0), bw, sur, limitEx, maxGirth: maxGirthValue };
            };

            // 计费核心函数 - 明扬小货海运
            const calcMYSmall = (pkgs, reg) => {
                let totalV = 0, totalA = 0;
                let limitEx = false;
                let maxGirthValue = 0;
                let totalBw = 0;
                const isMulti = pkgs.length > 1; // 判断是否大于1件
                const surMap = {};
                const addSur = (name, cost) => {
                    if (!surMap[name]) surMap[name] = { name, cost: 0, count: 0 };
                    surMap[name].cost += cost;
                    surMap[name].count += 1;
                };

                // 核心修改：明扬小货仅限单件，超过1件直接熔断报错
                if (isMulti) {
                    return { 
                        totalCost: Infinity, 
                        bw: 0, 
                        sur: [{ name: '渠道限制', cost: 0, count: 1 }, { name: '↳ 仅限单件，多件请走加班船', cost: 0, count: 1 }], 
                        limitEx: false, 
                        maxGirth: 0, 
                        isError: true, 
                        errorMsg: '一票多件请发加班船渠道' 
                    };
                }

                pkgs.forEach(p => {
                    const sides = [p.l,p.w,p.h].sort((a,b)=>b-a);
                    const girth = sides[0] + 2*(sides[1]+sides[2]);
                    if (girth > maxGirthValue) maxGirthValue = girth;
                    if (girth > YUNDING_LIMIT) limitEx = true;
                    
                    let v = (p.l*p.w*p.h)/6000;
                    let a = p.weight||0;
                    totalV += v; 
                    totalA += a;

                    let p_bw = Math.max(v, a);
                    totalBw += p_bw;

                    if (sides[0] > 120 && sides[0] < 200) addSur('长边120-200cm', 100);
                    else if (sides[0] >= 200) addSur('长边≥200cm', 200);
                    if (sides[1] > 75) addSur('二边>75cm', 100);
                    if (p.weight >= 22) addSur('实重>22kg', 100);
                    if (girth > 266 && girth < 320) addSur('围长266-320cm', 100);
                    else if (girth >= 320) addSur('围长≥320cm', 600);
                });
                
                let bw = Math.ceil(Math.max(totalV, totalA)); 
                if (bw < 5) bw = 5;
                const sur = Object.values(surMap);

                const configs = { east: { extra: 17, base: 160 }, mid: { extra: 16, base: 150 }, west: { extra: 15, base: 140 } };
                let baseCost = (bw - 5) * configs[reg].extra + configs[reg].base;

                return { totalCost: baseCost + sur.reduce((a,b)=>a+b.cost,0), bw, sur, limitEx, maxGirth: maxGirthValue };
            };

            // 计费核心函数 - 正石
            const calcZS = (pkgs, reg) => {
                let totalV = 0, totalA = 0;
                let limitEx = false;
                let totalSurCharge = 0;
                let maxGirthValue = 0;
                let totalBw = 0;
                const surMap = {};
                const addSur = (name, cost) => {
                    if (!surMap[name]) surMap[name] = { name, cost: 0, count: 0 };
                    surMap[name].cost += cost;
                    surMap[name].count += 1;
                };

                pkgs.forEach(p => {
                    const sides = [p.l,p.w,p.h].sort((a,b)=>b-a);
                    const girth = sides[0] + 2*(sides[1]+sides[2]);
                    if (girth > maxGirthValue) maxGirthValue = girth;
                    if (girth > YUNDING_LIMIT) limitEx = true;
                    
                    let v = (p.l*p.w*p.h)/6000;
                    let a = p.weight||0;
                    totalV += v; 
                    totalA += a;

                    // 核心修改：正石每件货物最低计费重按4kg起算
                    let p_bw = Math.max(v, a);
                    if (p_bw < 4) p_bw = 4;
                    totalBw += p_bw;

                    let dimSurs = [];
                    if (sides[0] >= 120) dimSurs.push(80);
                    if (sides[1] >= 76) dimSurs.push(80);
                    if (girth >= 263 && girth < 326) dimSurs.push(80);
                    if (sides[0] >= 240 || girth >= 326) dimSurs.push(500);
                    if (dimSurs.length > 0) {
                        const highestDim = Math.max(...dimSurs);
                        totalSurCharge += highestDim;
                        addSur(`尺寸类最高项`, highestDim);
                    }
                    let weightSur = 0;
                    if (p.weight >= 40) weightSur = 500;
                    else if (p.weight >= 21) weightSur = 80;
                    if (weightSur > 0) {
                        totalSurCharge += weightSur;
                        addSur(`实重附加费`, weightSur);
                    }
                });
                const sur = Object.values(surMap);
                
                // 使用累计的每件最低4kg后的总重量
                let bw = Math.ceil(totalBw);
                
                let baseCost = 0;
                if (bw <= 10) {
                    const steps = { west: { 4:126, 5:131, 6:140, 7:149, 8:158, 9:167, 10:175 }, mid: { 4:135, 5:142, 6:150, 7:158, 8:166, 9:174, 10:180 }, east: { 4:155, 5:160, 6:166, 7:172, 8:178, 9:184, 10:190 } }[reg];
                    baseCost = steps[bw];
                } else {
                    const rates = { west: bw >= 96 ? 16.5 : 17.5, mid: bw >= 96 ? 17 : 18, east: bw >= 96 ? 18 : 19 }[reg];
                    baseCost = bw * rates;
                }
                return { totalCost: baseCost + totalSurCharge, bw, sur, limitEx, maxGirth: maxGirthValue };
            };

            // 计费核心函数 - 澳洲海派
            const calcAU = (pkgs, zip) => {
                let limitEx = false;
                let maxGirthValue = 0;
                const sur = [];

                let sumOWPiece = 0;
                let maxOWMin = 0;
                let countOW = 0;

                let sumOSPiece = 0;
                let maxOSMin = 0;
                let countOS = 0;

                let totalBw = 0; // 累计每一件的最终计费重

                pkgs.forEach(p => {
                    const sides = [p.l, p.w, p.h].sort((a, b) => b - a);
                    const L = sides[0];
                    const W = sides[1];
                    const girth = L + 2 * (sides[1] + sides[2]);
                    if (girth > maxGirthValue) maxGirthValue = girth;
                    if (girth > YUNDING_LIMIT) limitEx = true;
                    
                    // 单件计费重，澳洲海派每件最低10kg起收
                    let p_bw = Math.max((p.l * p.w * p.h) / 6000, p.weight || 0);
                    if (p_bw < 10) p_bw = 10;
                    
                    totalBw += p_bw;

                    // 超重费逻辑
                    if (p_bw >= 80 && p_bw < 800) { sumOWPiece += 300; maxOWMin = Math.max(maxOWMin, 300); countOW++; }

                    return true;
                }
                // 如果后续有特殊的偏远邮编前缀例外，可以加在这个数组里
                const extraRemotePrefixes = []; 
                if (extraRemotePrefixes.includes(prefix)) return true;
                
                return false;
            }, [caZipCode]);

            // 按照 orderQty 动态展开所有的包装件 (用于原始散件计算)
            const effPkgs = useMemo(() => {
                const expanded = [];
                for (let i = 0; i < orderQty; i++) {
                    packages.forEach(p => {
                        const pQty = Math.max(1, parseInt(p.qty) || 1);
                        for (let j = 0; j < pQty; j++) {
                            expanded.push({
                                ...p,
                                id: `${p.id}-${i}-${j}`,
                                l: p.l + BASE_BUFFER + (useCrate ? CRATE_BUFFER : 0),
                                w: p.w + BASE_BUFFER + (useCrate ? CRATE_BUFFER : 0),
                                h: p.h + BASE_BUFFER + (useCrate ? CRATE_BUFFER : 0)
                            });
                        }
                    });
                }
                return expanded;
            }, [packages, useCrate, orderQty]);

            // --- 云鼎计费逻辑 ---
            const ydResult = useMemo(() => {
                // 如果没有输入邮编，或者长度不够，则默认使用 30001
                const effectiveZip = (!zipCode || zipCode.trim().length < 3) ? '30001' : zipCode.trim();

                const weight = Math.max(YUNDING_MIN_WEIGHT, Math.ceil(Math.max(
                    effPkgs.reduce((a, p) => a + (p.l * p.w * p.h) / 6000, 0),
                    effPkgs.reduce((a, p) => a + (p.weight || 0), 0)
                )));
                const match = YUNDING_RATES.find(g => g.match(effectiveZip));
                if (!match) return null;

                const maxSideLength = Math.max(...effPkgs.flatMap(p => [p.l, p.w, p.h]));
                
                let sideSurcharge = 0;
                if (maxSideLength >= 500) sideSurcharge = 10500;
                else if (maxSideLength >= 400) sideSurcharge = 4100;
                else if (maxSideLength >= 300) sideSurcharge = 2000;

                let pi = weight >= 3001 ? 6 : weight >= 2001 ? 5 : weight >= 1001 ? 4 : weight >= 501 ? 3 : weight >= 301 ? 2 : weight >= 201 ? 1 : 0;
                
                const baseTotal = weight * match.rates[pi] + 500;
                const finalTotal = baseTotal + sideSurcharge;
                
                const formula = `(${weight}kg * ¥${match.rates[pi]}) + ¥500${sideSurcharge > 0 ? ` + ¥${sideSurcharge}(超长费)` : ''}`;

                return { 
                    total: finalTotal.toFixed(2), 
                    price: match.rates[pi], 
                    weight, 
                    formula,
                    sideSurcharge,
                    isDefaultZip: effectiveZip === '30001' && (!zipCode || zipCode.trim().length < 3)
                };
            }, [zipCode, effPkgs]);

            const boxingAdvice = useMemo(() => {
                if (packages.length > 1) return null;
                const raw = packages[0]; if(!raw.l || !raw.w || !raw.h) return null;
                const sortedU = [raw.l + BASE_BUFFER, raw.w + BASE_BUFFER, raw.h + BASE_BUFFER].sort((a,b)=>a-b);
                const uS = sortedU[0], uM = sortedU[1], uL = sortedU[2];
                
                // 核心修改1：精准判断原产品是否已经属于超长件（基于裸尺寸，不含缓冲），一旦满足则豁免红线阻拦
                const isLengthExempt = Math.max(raw.l, raw.w, raw.h) >= RED_LINE_LONGEST;
                
                const check = (nx, ny, nz, totalA) => {
                    const extra = useCrate ? CRATE_BUFFER : 0;
                    const finalDims = [uS*nx+extra, uM*ny+extra, uL*nz+extra].sort((a,b)=>b-a);
                    const girth = finalDims[0] + 2*(finalDims[1]+finalDims[2]);
                    const errors = [];
                    if (totalA > RED_LINE_WEIGHT) errors.push(`重量超标 (>20kg)`);
                    if (finalDims[0] >= RED_LINE_LONGEST && !isLengthExempt) errors.push(`最长边超限 (≥120cm)`);
                    if (finalDims[1] > RED_LINE_SECOND) errors.push(`第二边超限 (>75cm)`);
                    if (girth > RED_LINE_GIRTH) errors.push(`围长超限 (>260cm)`);
                    const checkPkgs = [{l:finalDims[0], w:finalDims[1], h:finalDims[2], weight:totalA}];
                    // 这里为了给推演模型使用，局部算一下昌晖成本
                    let totalV = (finalDims[0]*finalDims[1]*finalDims[2])/6000;
                    let bw = Math.ceil(Math.max(totalV, totalA)); if(bw < 12) bw = 12;
                    let reg = 'east';
                    if (zipCode) {
                        const pre = zipCode.trim()[0];
                        if (['5', '6', '7'].includes(pre)) reg = 'mid';
                        else if (!['0', '1', '2', '3', '4'].includes(pre)) reg = 'west';
                    }
                    const r = { west:{b:135,e:14,m:19,h:16}, mid:{b:145,e:15,m:20,h:17}, east:{b:165,e:17,m:21,h:18} }[reg];
                    let cCH = bw >= 101 ? bw*r.h : bw >= 12 ? bw*r.m : r.b + (bw-5)*r.e;
                    if (useCrate) cCH += 10; // 昌晖木箱费

                    const crateCst = calculateCrateCost(finalDims[0], finalDims[1], finalDims[2]);
                    return { ok: errors.length === 0, errors, totalBoxCostCH: cCH, dims: finalDims, layout: `${nx}×${ny}×${nz}`, girth, totalA, crateCost: crateCst };
                };
                
                // 1. 穷举并记录所有不触发红线的合法排布方案
                let bestSingle = { n: 1, ...check(1,1,1, raw.weight||0) };
                const plans = { 1: bestSingle };
                let validMaxN = 1;
                
                // 核心修改2：扩大检索范围，支持极端小尺寸大批量合箱 (最大支持单箱300件合集)
                const maxN = raw.weight > 0 ? Math.floor(RED_LINE_WEIGHT / raw.weight) : 300;
                
                let bestOverall = bestSingle;

                for (let n = 2; n <= Math.min(maxN, 300); n++) {
                    let bestForN = null;
                    for (let nx=1; nx<=n; nx++) {
                        if (n%nx!==0) continue;
                        let r = n/nx;
                        for (let ny=1; ny<=r; ny++) {
                            let nz = r/ny; if(r%ny!==0) continue;
                            const res = check(nx, ny, nz, (raw.weight||0)*n);
                            if(res.ok && (!bestForN || res.totalBoxCostCH < bestForN.totalBoxCostCH)) {
                                bestForN = { n, ...res };
                            }
                        }
                    }
                    if (bestForN && bestForN.ok) {
                        plans[n] = bestForN;
                        validMaxN = n;
                        
                        // 抛弃价格对比，只要能装下，无脑追求最大物理容量
                        bestOverall = bestForN;
                    }
                }
                
                // 2. 根据用户填写的【真实订单件数】，推演最大合箱方案
                let bestFullPlan = null;
                const totalSameSizeBoxes = orderQty * Math.max(1, parseInt(raw.qty) || 1);

                // 从最大的合法合箱数(validMaxN)向下寻找，只要装得下，直接采用，不管运费均价
                for (let optN = Math.min(validMaxN, totalSameSizeBoxes); optN >= 1; optN--) {
                    if (!plans[optN] || !plans[optN].ok) continue;
                    
                    const numFull = Math.floor(totalSameSizeBoxes / optN);
                    const rem = totalSameSizeBoxes % optN;
                    
                    // 确保“尾件”方案也是在红线以内能正常打包的
                    if (rem > 0 && (!plans[rem] || !plans[rem].ok)) continue;
                    
                    // 找到的最大合箱数方案即为采用方案
                    const totalCostCH = (numFull * plans[optN].totalBoxCostCH) + (rem > 0 ? plans[rem].totalBoxCostCH : 0);
                    const totalCrateCost = (numFull * plans[optN].crateCost) + (rem > 0 ? plans[rem].crateCost : 0);
                    
                    bestFullPlan = {
                        totalCostCH,
                        totalCrateCost,
                        boxes: numFull,
                        rem,
                        remPlan: rem > 0 ? plans[rem] : null,
                        optN,
                        mainPlan: plans[optN],
                        totalSameSizeBoxes
                    };
                    break; // 找到能装最多的方案，直接跳出
                }
                
                // 如果单件就超红线，直接返回报错
                if (!bestSingle.ok) {
                    return { ...bestSingle, fullPlan: null, isLengthExempt };
                }
                
                // 【展示逻辑】：如果存在多件，展示专门为这个数量定制的最大主箱；如果只有1件，展示理论极限
                if (totalSameSizeBoxes > 1 && bestFullPlan) {
                    return { ...bestFullPlan.mainPlan, fullPlan: bestFullPlan, isLengthExempt };
                } else {
                    return { ...bestOverall, fullPlan: null, isLengthExempt };
                }
            }, [packages, orderQty, useCrate, zipCode]);

            // 核心修改点：为按件/按票且有起重要求的国家（澳洲、阿联酋、沙特）生成【合箱后的物理包裹列表】
            const optimizedPkgs = useMemo(() => {
                const totalSameSizeBoxes = packages.length === 1 ? orderQty * Math.max(1, parseInt(packages[0].qty) || 1) : 0;
                if (packages.length === 1 && totalSameSizeBoxes > 1 && boxingAdvice?.fullPlan && boxingAdvice.ok) {
                    const result = [];
                    const { boxes, rem, remPlan, mainPlan } = boxingAdvice.fullPlan;
                    const mainDims = mainPlan.dims; 
                    const mainWeight = mainPlan.totalA;
                    for (let i = 0; i < boxes; i++) {
                        result.push({ l: mainDims[0], w: mainDims[1], h: mainDims[2], weight: mainWeight });
                    }
                    if (rem > 0 && remPlan) {
                        result.push({ l: remPlan.dims[0], w: remPlan.dims[1], h: remPlan.dims[2], weight: remPlan.totalA });
                    }
                    return result;
                }
                // 如果无法合箱或不需要合箱，则回退为原始散件
                return effPkgs;
            }, [packages.length, orderQty, boxingAdvice, effPkgs, packages]);

            // 昌晖、明扬、正石现在统一使用优化合箱后的包裹列表进行计算！
            const changhuiResult = useMemo(() => calcCH(optimizedPkgs, changhuiRegion, useCrate), [optimizedPkgs, changhuiRegion, useCrate]);
            const chSmallResult = useMemo(() => calcCHSmall(optimizedPkgs, changhuiRegion, useCrate), [optimizedPkgs, changhuiRegion, useCrate]);
            const mingyangResult = useMemo(() => calcMY(optimizedPkgs, mingyangRegion), [optimizedPkgs, mingyangRegion]);
            const mySmallResult = useMemo(() => calcMYSmall(optimizedPkgs, mingyangRegion), [optimizedPkgs, mingyangRegion]);
            const zhengshiResult = useMemo(() => calcZS(optimizedPkgs, zhengshiRegion), [optimizedPkgs, zhengshiRegion]);
            
            // 澳洲、阿联酋、沙特、加拿大使用优化后的包裹列表进行计算
            const auResult = useMemo(() => calcAU(optimizedPkgs, auZipCode), [optimizedPkgs, auZipCode]);
            const uaeResult = useMemo(() => calcUAE(optimizedPkgs, useCrate), [optimizedPkgs, useCrate]);
            const saResult = useMemo(() => calcSA(optimizedPkgs, useCrate), [optimizedPkgs, useCrate]);
            const uaeAirResult = useMemo(() => calcUAEAir(optimizedPkgs, useCrate), [optimizedPkgs, useCrate]);
            const saAirResult = useMemo(() => calcSAAir(optimizedPkgs, useCrate), [optimizedPkgs, useCrate]);
            const caResult = useMemo(() => calcCA(optimizedPkgs, useCrate, caRemoteStatus), [optimizedPkgs, useCrate, caRemoteStatus]);
            const hcResult = useMemo(() => calcHC(optimizedPkgs, useCrate, caRemoteStatus), [optimizedPkgs, useCrate, caRemoteStatus]);
            const zscaResult = useMemo(() => calcZSCA(optimizedPkgs, useCrate, caRemoteStatus), [optimizedPkgs, useCrate, caRemoteStatus]);

            const isOptimized = optimizedPkgs !== effPkgs;
            const isAUOptimized = isOptimized;

            // 终端售价推演中的运费阶梯：
            // ≤5kg: 200元
            // 5-12kg: 276元 (12*23)
            // >12kg: 计费重*23
            // 云鼎按20元/kg (保留原有附加费)
            const deducedShippingInfo = useMemo(() => {
                if (changhuiResult.limitEx && ydResult) {
                    const surcharge = 500 + (ydResult.sideSurcharge || 0);
                    return { total: (ydResult.weight * 20) + surcharge, rateText: '20元/kg', type: '云鼎', surcharge };
                }
                const surcharge = changhuiResult.sur.reduce((a, b) => a + b.cost, 0);
                let bw = changhuiResult.bw;
                let baseFreight = 0;
                let rateText = "";
                
                if (bw <= 5) {
                    baseFreight = 200;
                    rateText = '200元(≤5kg)';
                } else if (bw <= 12) {
                    baseFreight = 276;
                    rateText = '276元(5-12kg)';
                } else {
                    baseFreight = bw * 23;
                    rateText = '23元/kg';
                }
                
                return { total: baseFreight + surcharge, rateText, type: '昌晖加班船', surcharge };
            }, [changhuiResult, ydResult]);

            const finalPriceData = useMemo(() => {
                // 【核心修复】：真正的总件数 = (所有包装的件数之和) * 订单组数
                const totalItemsCount = packages.reduce((sum, p) => sum + Math.max(1, parseInt(p.qty) || 1), 0) * orderQty;
                
                const productUnitCost = parseFloat(purchasePrice) || 0;
                // 产品成本恢复为仅受“订单件数”影响，不受包装列表里的物理件数影响
                const totalProductCost = productUnitCost * orderQty; 
                let crateCostTotal = 0;
                
                const totalSameSizeBoxes = packages.length === 1 ? orderQty * Math.max(1, parseInt(packages[0].qty) || 1) : 0;
                if (packages.length === 1 && totalSameSizeBoxes > 1 && boxingAdvice?.fullPlan && boxingAdvice.ok) {
                    crateCostTotal = boxingAdvice.fullPlan.totalCrateCost;
                } else {
                    crateCostTotal = effPkgs.reduce((acc, p) => acc + calculateCrateCost(p.l, p.w, p.h), 0);
                }
                
                const shippingCost = deducedShippingInfo.total;
                const totalSellingPriceUSD = ((totalProductCost + shippingCost + crateCostTotal) * 2.4) / (parseFloat(exchangeRate) || 6.2);
                // 均价也恢复为按“订单件数”平摊
                return { totalUSD: totalSellingPriceUSD.toFixed(2), unitUSD: (totalSellingPriceUSD / orderQty).toFixed(2), totalProductCost, shippingCost, crateCost: crateCostTotal, totalItemsCount };
            }, [purchasePrice, orderQty, deducedShippingInfo, useCrate, exchangeRate, boxingAdvice, effPkgs, packages]);

            const currentMaxGirthValue = Math.max(changhuiResult.maxGirth, chSmallResult.maxGirth, mingyangResult.maxGirth, mySmallResult.maxGirth, zhengshiResult.maxGirth, auResult.maxGirth, uaeResult.maxGirth, saResult.maxGirth, uaeAirResult.maxGirth, saAirResult.maxGirth, caResult.maxGirth, hcResult.maxGirth, zscaResult.maxGirth);
            const isAnyGirthOverLimit = currentMaxGirthValue > YUNDING_LIMIT;

            // 美国专线自动排序
            const sortedUSCarriers = useMemo(() => {
                const list = [
                    { id: 'ch', type: 'standard', title: '昌晖加班船海运参考', res: changhuiResult, color: 'indigo', reg: regionLabel[changhuiRegion], cost: changhuiResult.totalCost },
                    { id: 'ch_small', type: 'standard', title: '昌晖小货海运参考', res: chSmallResult, color: 'indigo', reg: regionLabel[changhuiRegion], cost: chSmallResult.totalCost },
                    { id: 'my', type: 'standard', title: '明扬加班船海运参考', res: mingyangResult, color: 'emerald', reg: regionLabel[mingyangRegion], cost: mingyangResult.totalCost },
                    { id: 'my_small', type: 'standard', title: '明扬小货海运参考', res: mySmallResult, color: 'emerald', reg: regionLabel[mingyangRegion], cost: mySmallResult.totalCost },
                    { id: 'zs', type: 'standard', title: '正石海运参考', res: zhengshiResult, color: 'rose', reg: regionLabel[zhengshiRegion], cost: zhengshiResult.totalCost }
                ];
                
                if (ydResult) {
                    list.push({ id: 'yd', type: 'yunding', res: ydResult, cost: parseFloat(ydResult.total) });
                }
                
                return list.sort((a, b) => a.cost - b.cost);
            }, [changhuiResult, chSmallResult, mingyangResult, mySmallResult, zhengshiResult, ydResult, changhuiRegion, mingyangRegion, zhengshiRegion]);

            const isSinglePackageMulti = packages.length === 1 && (orderQty * Math.max(1, parseInt(packages[0].qty) || 1)) > 1;

            return (
                <div className="min-h-screen p-4 md:p-8 bg-slate-50 text-slate-900 font-sans text-xs">
                    <div className="max-w-6xl mx-auto">
                        <header className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
                            <div className="flex items-center gap-3">
                                <div className="bg-indigo-600 p-3 rounded-2xl shadow-lg shadow-indigo-200"><Icon name="box" className="text-white w-6 h-6" /></div>
                                <div>
                                    <h1 className="text-2xl font-black text-slate-800 tracking-tight">昌晖/明扬/正石运费精算器</h1>
                                    <p className="text-slate-500 font-black uppercase tracking-widest text-[10px]">Multi-Package & Carrier Engine</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-2 bg-white px-3 py-2 rounded-xl shadow-sm border border-slate-100 font-black">
                                <div className="px-2 border-r border-slate-100 text-indigo-600 text-center"><div className="text-[8px] opacity-40 uppercase">昌晖</div>{regionLabel[changhuiRegion]}</div>
                                <div className="px-2 border-r border-slate-100 text-emerald-600 text-center"><div className="text-[8px] opacity-40 uppercase">明扬</div>{regionLabel[mingyangRegion]}</div>
                                <div className="px-2 border-r border-slate-100 text-rose-600 text-center"><div className="text-[8px] opacity-40 uppercase">正石</div>{regionLabel[zhengshiRegion]}</div>
                                <div className="px-2 border-r border-slate-100 text-cyan-600 text-center"><div className="text-[8px] opacity-40 uppercase">澳洲</div>{auRegionLabel}</div>
                                <div className="px-2 text-fuchsia-600 text-center">
                                    <div className="text-[8px] opacity-40 uppercase">加拿大</div>
                                    <div className="flex items-center justify-center gap-0.5">
                                        <span>{caZipCode ? caZipCode.substring(0,3) : '全区'}</span>
                                        {caRemoteStatus !== null && (
                                            <span className={`text-[8px] px-1 rounded ${caRemoteStatus ? 'bg-red-100 text-red-600' : 'bg-emerald-100 text-emerald-600'}`}>
                                                {caRemoteStatus ? '偏远' : '标准'}
                                            </span>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </header>

                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                            <div className="lg:col-span-4 space-y-6">
                                <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                                    <h2 className="font-bold text-slate-700 mb-6 flex items-center gap-2 text-sm"><Icon name="edit-3" /> 核心参数输入</h2>
                                    <div className="space-y-4">
                                        <div className="grid grid-cols-1 gap-3">
                                            <div className="p-3 bg-indigo-50/50 rounded-2xl border border-indigo-100/50">
                                                <label className="text-[9px] font-black uppercase block mb-1.5 opacity-80 tracking-widest text-indigo-800 flex items-center gap-1"><Icon name="flag" className="w-3 h-3" />美国邮编</label>
                                                <input type="text" value={zipCode} onChange={e => setZipCode(e.target.value.replace(/\D/g, '').substring(0, 5))} maxLength="5" placeholder="例: 90001" className="w-full bg-white border border-indigo-200 rounded-xl px-3 py-2 font-black text-indigo-700 outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-xs" />
                                            </div>
                                            <div className="p-3 bg-cyan-50/50 rounded-2xl border border-cyan-100/50">
                                                <label className="text-[9px] font-black uppercase block mb-1.5 opacity-80 tracking-widest text-cyan-800 flex items-center gap-1"><Icon name="globe" className="w-3 h-3" />澳洲邮编</label>
                                                <input type="text" value={auZipCode} onChange={e => setAuZipCode(e.target.value.replace(/\D/g, '').substring(0, 4))} maxLength="4" placeholder="例: 2000" className="w-full bg-white border border-cyan-200 rounded-xl px-3 py-2 font-black text-cyan-700 outline-none focus:ring-2 focus:ring-cyan-500 transition-all text-xs" />
                                            </div>
                                            <div className="p-3 bg-fuchsia-50/50 rounded-2xl border border-fuchsia-100/50">
                                                <label className="text-[9px] font-black uppercase block mb-1.5 opacity-80 tracking-widest text-fuchsia-800 flex items-center justify-between gap-1">
                                                    <span className="flex items-center gap-1"><Icon name="map-pin" className="w-3 h-3" />加拿大邮编</span>
                                                    {caRemoteStatus !== null && (
                                                        <span className={`text-[8px] px-1.5 py-0.5 rounded shadow-sm ${caRemoteStatus ? 'bg-red-500 text-white' : 'bg-emerald-500 text-white'}`}>
                                                            {caRemoteStatus ? '偏远区' : '标准区'}
                                                        </span>
                                                    )}
                                                </label>
                                                <input type="text" value={caZipCode} onChange={e => setCaZipCode(e.target.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase().substring(0, 6))} maxLength="6" placeholder="例: V6B1A1" className="w-full bg-white border border-fuchsia-200 rounded-xl px-3 py-2 font-black text-fuchsia-700 outline-none focus:ring-2 focus:ring-fuchsia-500 transition-all text-xs" />
                                            </div>
                                        </div>
                                        
                                        <div className="space-y-3">
                                            <div className="flex justify-between items-center px-1">
                                                <span className="text-[10px] font-black uppercase opacity-60 tracking-wider">包装尺寸列表</span>
                                                <button onClick={addPackage} className="text-indigo-600 hover:text-indigo-700 font-black flex items-center gap-1 transition-colors">
                                                    <Icon name="plus-circle" className="w-3.5 h-3.5" />添加
                                                </button>
                                            </div>
                                            {packages.map((pkg, index) => (
                                                <div key={pkg.id} className="p-4 border border-slate-100 bg-slate-50/50 rounded-2xl relative">
                                                    <div className="flex justify-between items-center mb-3">
                                                        <span className="bg-white border px-2 py-0.5 rounded-md text-[9px] font-black text-slate-400">包装 #{index + 1}</span>
                                                        {packages.length > 1 && (
                                                            <button onClick={() => removePackage(pkg.id)} className="text-rose-400 hover:text-rose-600 transition-colors">
                                                                <Icon name="trash-2" className="w-3.5 h-3.5" />
                                                            </button>
                                                        )}
                                                    </div>
                                                    <div className="grid grid-cols-5 gap-2 text-slate-600 font-bold">
                                                        {[{ k: 'l', l: '长(cm)' }, { k: 'w', l: '宽(cm)' }, { k: 'h', l: '高(cm)' }, { k: 'weight', l: '重(kg)' }, { k: 'qty', l: '件数' }].map(item => (
                                                            <div key={item.k}>
                                                                <label className="text-[8px] sm:text-[9px] font-black uppercase block mb-1 opacity-60 text-center">{item.l}</label>
                                                                <input type="number" value={pkg[item.k] === 0 && item.k !== 'qty' ? '' : pkg[item.k]} onChange={e => updatePkgField(pkg.id, item.k, e.target.value)} className="w-full bg-white border border-slate-200 rounded-lg px-1 py-1.5 text-xs font-bold outline-none text-center" placeholder={item.k === 'qty' ? '1' : '0'} min={item.k === 'qty' ? '1' : '0'} />
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="mt-4 pt-4 border-t border-slate-100 space-y-4">
                                        <div className="grid grid-cols-2 gap-3 font-bold text-slate-700">
                                            <div><label className="text-[10px] font-black uppercase block mb-1 opacity-60">订单件数</label><input type="number" value={orderQty} onChange={e => setOrderQty(Math.max(1, parseInt(e.target.value)||1))} className="w-full bg-slate-50 border ring-1 ring-slate-100 rounded-xl px-4 py-2 font-black outline-none" /></div>
                                            <div><label className="text-[10px] font-black uppercase block mb-1 opacity-60">产品成本(¥)</label><input type="number" value={purchasePrice} onChange={e => setPurchasePrice(e.target.value)} className="w-full bg-slate-50 border ring-1 ring-slate-100 rounded-xl px-4 py-2 font-black outline-none" /></div>
                                        </div>
                                        <div className="flex flex-col gap-4">
                                            <div><label className="text-[10px] font-black uppercase block mb-1 opacity-60 tracking-wider">实时汇率</label><input type="number" value={exchangeRate} onChange={e => setExchangeRate(e.target.value)} className="w-full bg-slate-50 border ring-1 ring-slate-100 rounded-xl px-4 py-2 font-black outline-none" /></div>
                                            <label className="flex items-center justify-between cursor-pointer bg-amber-50/50 p-3 rounded-2xl border border-amber-100/50">
                                                <div className="flex items-center gap-3 text-amber-900"><Icon name="package" className="w-4 h-4" /><span className="text-xs font-black">加固木箱 (+{CRATE_BUFFER}cm)</span></div>
                                                <input type="checkbox" className="sr-only peer" checked={useCrate} onChange={() => setUseCrate(!useCrate)} />
                                                <div className="w-11 h-6 bg-slate-200 rounded-full peer peer-checked:bg-amber-500 relative after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-full"></div>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                                <div className="bg-slate-800 rounded-3xl p-6 text-white shadow-xl text-[10px]">
                                    <h3 className="font-bold mb-4 text-slate-400 flex items-center gap-2 border-b border-slate-700 pb-2 uppercase tracking-widest"><Icon name="alert-circle" className="text-rose-400" /> 合箱红线规则</h3>
                                    <div className="space-y-3 opacity-90 leading-relaxed text-slate-300 font-medium">
                                        <div className="flex justify-between items-center text-indigo-300 font-black mb-1"><span>单件修正：</span><span>各边先 +{BASE_BUFFER}cm</span></div>
                                        <div className="flex justify-between font-bold"><span>合箱重量上限</span> <span className="text-white font-bold">{RED_LINE_WEIGHT.toFixed(1)} KG</span></div>
                                        <div className="flex justify-between font-bold"><span>单箱最长边</span> <span className="text-white font-bold">&lt; {RED_LINE_LONGEST} CM</span></div>
                                        <div className="flex justify-between font-bold"><span>单箱第二边</span> <span className="text-white font-bold">≤ {RED_LINE_SECOND} CM</span></div>
                                        <div className="flex justify-between font-bold"><span>单箱围长</span> <span className="text-white font-bold">≤ {RED_LINE_GIRTH} CM</span></div>
                                        <div className="flex justify-between pt-2 border-t border-slate-700 text-amber-400 font-black italic">
                                            <span>超大件标准 (云鼎)</span> <span>&gt; {YUNDING_LIMIT} CM</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="lg:col-span-8 space-y-6">
                                {isAnyGirthOverLimit && (
                                    <div className="bg-orange-500 border-2 border-orange-600 rounded-3xl p-6 text-white shadow-2xl flex items-center gap-6 animate-pulse">
                                        <div className="bg-white/20 p-4 rounded-full shadow-inner"><Icon name="alert-triangle" className="w-8 h-8" /></div>
                                        <div><h4 className="text-lg font-black tracking-tight uppercase">超大件建议</h4><p className="text-sm font-bold opacity-90 leading-tight">修正后围长已达 {currentMaxGirthValue.toFixed(1)}cm。只能发云鼎超大件！</p></div>
                                    </div>
                                )}

                                <div className="space-y-8 max-w-xl mx-auto w-full">
                                    {/* 美国快递板块 */}
                                    <div>
                                        <div className="flex items-center gap-2 mb-4 px-2">
                                            <span className="bg-indigo-100 text-indigo-800 px-3 py-1.5 rounded-full text-[11px] font-black uppercase tracking-widest border border-indigo-200 flex items-center gap-1"><Icon name="flag" className="w-3.5 h-3.5" /> 美国快递运费计算</span>
                                        </div>
                                        <div className="flex flex-col gap-4">
                                            {sortedUSCarriers.map((item, index) => {
                                                const isBest = index === 0; // 排序后第一个就是最便宜的
                                                if (item.type === 'yunding') {
                                                    return <YundingCard key={item.id} res={item.res} isBest={isBest} />;
                                                } else {
                                                    return <CarrierCard key={item.id} title={item.title} res={item.res} color={item.color} reg={item.reg} pkgCount={optimizedPkgs.length} isBest={isBest} isOptimized={isOptimized} originalCount={effPkgs.length} />;
                                                }
                                            })}
                                        </div>
                                    </div>

                                    {/* 其他国家快递板块 */}
                                    <div className="pt-6 border-t border-slate-200 border-dashed">
                                        <div className="flex items-center gap-2 mb-4 px-2">
                                            <span className="bg-cyan-100 text-cyan-800 px-3 py-1.5 rounded-full text-[11px] font-black uppercase tracking-widest border border-cyan-200 flex items-center gap-1"><Icon name="globe" className="w-3.5 h-3.5" /> 其他国家的快递运费计算</span>
                                        </div>
                                        <div className="flex flex-col gap-4">
                                            <CarrierCard title="正石加拿大海运参考" res={zscaResult} color="blue" reg="全区" pkgCount={optimizedPkgs.length} isBest={false} isOptimized={isAUOptimized} originalCount={effPkgs.length} />
                                            <CarrierCard title="河池加拿大海运参考" res={hcResult} color="teal" reg="全区" pkgCount={optimizedPkgs.length} isBest={false} isOptimized={isAUOptimized} originalCount={effPkgs.length} />
                                            <CarrierCard title="信源加拿大海运参考" res={caResult} color="fuchsia" reg="全区" pkgCount={optimizedPkgs.length} isBest={false} isOptimized={isAUOptimized} originalCount={effPkgs.length} />
                                            <CarrierCard title="澳洲包税专线海派" res={auResult} color="cyan" reg={auRegionLabel} pkgCount={optimizedPkgs.length} isBest={false} isOptimized={isAUOptimized} originalCount={effPkgs.length} />
                                            <CarrierCard title="阿联酋空运参考" res={uaeAirResult} color="sky" reg="全区" pkgCount={optimizedPkgs.length} isBest={false} isOptimized={isAUOptimized} originalCount={effPkgs.length} />
                                            <CarrierCard title="沙特空运参考" res={saAirResult} color="pink" reg="全区" pkgCount={optimizedPkgs.length} isBest={false} isOptimized={isAUOptimized} originalCount={effPkgs.length} />
                                            <CarrierCard title="阿联酋海运参考" res={uaeResult} color="violet" reg="全区" pkgCount={optimizedPkgs.length} isBest={false} isOptimized={isAUOptimized} originalCount={effPkgs.length} />
                                            <CarrierCard title="沙特海运参考" res={saResult} color="amber" reg="全区" pkgCount={optimizedPkgs.length} isBest={false} isOptimized={isAUOptimized} originalCount={effPkgs.length} />
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                                    <div className="bg-emerald-50 px-8 py-4 border-b border-emerald-100 flex justify-between items-center text-emerald-700 font-black">
                                        <span>终端售价推演模型</span><Icon name="dollar-sign" />
                                    </div>
                                    <div className="p-8 flex flex-col md:flex-row items-center justify-between gap-10">
                                        <div className="flex-1 text-center md:text-left space-y-4">
                                            <div><p className="text-[10px] font-black text-slate-400 uppercase mb-2 tracking-widest text-center md:text-left">终端建议总售价 (USD)</p><div className="text-7xl font-black text-emerald-600 tracking-tighter">${finalPriceData.totalUSD}</div></div>
                                            <p className="text-[9px] text-slate-400 font-bold italic">公式: (总产品成本 + 推演运费 + 木箱费) * 2.4 / {exchangeRate}</p>
                                        </div>
                                        <div className="bg-white p-6 rounded-3xl border border-slate-100 w-full md:w-80 space-y-4 font-bold text-slate-600 shadow-sm text-[11px]">
                                            <div className="flex justify-between items-center">
                                                <div className="flex flex-col">
                                                    <span>推演运费 ({deducedShippingInfo.type} {deducedShippingInfo.rateText}):</span>
                                                    {deducedShippingInfo.surcharge > 0 && <span className="text-[9px] text-slate-400 font-bold mt-0.5">含附加费: ¥{deducedShippingInfo.surcharge}</span>}
                                                </div>
                                                <span className="text-slate-900 font-black flex items-center gap-1">
                                                    ¥{finalPriceData.shippingCost.toFixed(1)}
                                                    {isSinglePackageMulti && boxingAdvice?.fullPlan && boxingAdvice.ok && (
                                                        <span className="text-[9px] text-emerald-600 bg-emerald-50 px-1 py-0.5 rounded border border-emerald-100 ml-1">已合箱优惠</span>
                                                    )}
                                                </span>
                                            </div>
                                            <div className="flex justify-between"><span>产品总成本 ({orderQty}单):</span><span className="text-slate-900 font-black">¥{finalPriceData.totalProductCost.toFixed(1)}</span></div>
                                            <div className="flex justify-between items-center">
                                                <span>木箱总成本:</span>
                                                <span className="text-amber-600 font-black flex items-center gap-1">
                                                    ¥{finalPriceData.crateCost.toFixed(1)}
                                                    {isSinglePackageMulti && boxingAdvice?.fullPlan && boxingAdvice.ok && useCrate && (
                                                        <span className="text-[9px] text-amber-600 bg-amber-50 px-1 py-0.5 rounded border border-amber-100 ml-1">已合箱优惠</span>
                                                    )}
                                                </span>
                                            </div>
                                            <div className="flex justify-between pt-4 border-t border-slate-100 font-black uppercase text-emerald-700"><span>综合成本基数 (总):</span><span className="text-lg">¥{(finalPriceData.totalProductCost + finalPriceData.shippingCost + finalPriceData.crateCost).toFixed(1)}</span></div>
                                        </div>
                                    </div>
                                </div>

                                {packages.length === 1 ? (
                                    boxingAdvice && (
                                        <div className={`rounded-3xl p-8 border shadow-sm transition-all ${boxingAdvice.ok ? 'bg-white border-indigo-100 shadow-indigo-100/20' : 'bg-red-50 border-red-200'}`}>
                                            <h3 className={`font-black mb-6 flex items-center gap-2 border-b pb-4 text-xs uppercase ${boxingAdvice.ok ? 'text-indigo-900 border-indigo-50' : 'text-red-900 border-red-200'}`}><Icon name={boxingAdvice.ok ? "layers" : "alert-triangle"} />{boxingAdvice.ok ? '最优合箱建议' : '不建议合箱'}</h3>
                                            {boxingAdvice.ok ? (
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-10">
                                                    <div className="space-y-6 text-center md:text-left">
                                                        <div className="flex items-baseline justify-center md:justify-start gap-3"><span className="text-8xl font-black text-indigo-600 leading-none tracking-tighter">{boxingAdvice.n}</span><span className="text-xl font-black text-slate-800 uppercase">件 / 箱</span></div>
                                                        <div className="p-5 bg-slate-50 border rounded-2xl space-y-3 font-bold text-slate-700 text-left text-[11px]">
                                                            <p className="text-[9px] text-slate-400 font-black uppercase tracking-widest">合箱建议外箱尺寸</p>
                                                            <p className="text-2xl font-black text-indigo-700">{boxingAdvice.dims[0].toFixed(1)}×{boxingAdvice.dims[1].toFixed(1)}×{boxingAdvice.dims[2].toFixed(1)} cm</p>
                                                            <div className="flex justify-between border-t pt-3 text-indigo-600 font-black"><span>加班船单箱总运费:</span><span>¥{boxingAdvice.totalBoxCostCH.toFixed(1)}</span></div>
                                                            <div className="flex justify-between text-indigo-500 font-bold opacity-80"><span>加班船分摊运费:</span><span>¥{(boxingAdvice.totalBoxCostCH / boxingAdvice.n).toFixed(2)} /件</span></div>
                                                        </div>
                                                        {boxingAdvice.fullPlan && boxingAdvice.fullPlan.totalSameSizeBoxes > 1 && (
                                                            <div className="mt-4 pt-4 border-t border-indigo-100/50">
                                                                <p className="text-[9px] text-slate-400 font-black uppercase tracking-widest mb-2">大批量智能分装方案 (自动推演: 共 {boxingAdvice.fullPlan.totalSameSizeBoxes} 件)</p>
                                                                <div className="flex flex-wrap gap-2 text-xs font-bold text-slate-700">
                                                                    {boxingAdvice.fullPlan.boxes > 0 && (
                                                                        <div className="bg-white px-3 py-2 rounded-xl border shadow-sm flex-1 text-center whitespace-nowrap">
                                                                            <span className="text-indigo-600 font-black text-sm">{boxingAdvice.fullPlan.boxes}</span> 箱 (装 <span className="text-indigo-600 font-black">{boxingAdvice.fullPlan.optN}</span> 件)
                                                                        </div>
                                                                    )}
                                                                    {boxingAdvice.fullPlan.rem > 0 && (
                                                                        <div className="bg-white px-3 py-2 rounded-xl border shadow-sm flex-1 text-center whitespace-nowrap">
                                                                            <span className="text-amber-600 font-black text-sm">1</span> 箱 (装 <span className="text-amber-600 font-black">{boxingAdvice.fullPlan.rem}</span> 件)
                                                                        </div>
                                                                    )}
                                                                </div>
                                                            </div>
                                                        )}
                                                    </div>
                                                    <div className="bg-indigo-50/50 p-6 rounded-3xl border border-indigo-100 flex flex-col justify-center space-y-3 font-bold">
                                                        <StatusItem label="实重 ≤ 20.0kg" val={`${boxingAdvice.totalA.toFixed(2)}kg`} ok={boxingAdvice.totalA <= 20} />
                                                        <StatusItem label={boxingAdvice.isLengthExempt ? "触发超长豁免(不限120)" : "最长边 < 120cm"} val={`${boxingAdvice.dims[0].toFixed(1)}cm`} ok={boxingAdvice.dims[0] < 120 || boxingAdvice.isLengthExempt} />
                                                        <StatusItem label="围长 ≤ 260cm" val={`${boxingAdvice.girth.toFixed(1)}cm`} ok={boxingAdvice.girth <= 260} />
                                                    </div>
                                                </div>
                                            ) : (
                                                <div className="text-red-600 font-bold space-y-3 p-4"><p className="text-sm italic">无法合箱理由：</p><ul className="list-disc pl-5 text-[11px] space-y-1">{boxingAdvice.errors.map((e,i) => <li key={i}>{e}</li>)}</ul></div>
                                            )}
                                        </div>
                                    )
                                ) : (
                                    <div className="bg-slate-100 rounded-3xl p-6 border border-dashed border-slate-300 text-center"><p className="text-slate-500 font-bold italic">输入了多型号包装，合箱建议暂不可用。</p></div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const YundingCard = ({ res, isBest }) => (
            <div className={`rounded-2xl shadow-sm border overflow-hidden flex relative transition-all ${isBest ? 'ring-2 ring-red-500 shadow-red-200 border-red-500' : 'border-slate-700'} bg-slate-800 text-white`}>
                {isBest && <div className="absolute top-0 right-0 bg-red-500 text-white text-[9px] font-black px-3 py-1 rounded-bl-lg uppercase z-10 shadow-md">最优惠</div>}
                <div className="w-[55%] p-4 flex flex-col justify-center border-l-4 border-amber-400 bg-slate-900/50">
                    <div className="flex items-center justify-between mb-2">
                        <span className="flex items-center gap-1 text-amber-400 font-black text-xs"><Icon name="award" className="w-3.5 h-3.5" /> 云鼎参考</span>
                        <span className="opacity-60 text-[10px] text-amber-400">{res.isDefaultZip ? '默认邮编30001' : '全区'}</span>
                    </div>
                    <div className="text-3xl font-black tracking-tighter text-amber-400">¥{res.total}</div>
                    <div className="text-[10px] font-bold mt-1 text-slate-400">¥{res.price}/KG | {res.weight}KG</div>
                </div>
                <div className="w-[45%] p-4 flex flex-col justify-center bg-slate-800 border-l border-slate-700">
                    <div className="space-y-1 text-[10px]">
                        {res.sideSurcharge > 0 ? (
                            <div className="flex justify-between font-bold text-amber-400"><span>超长费</span><span>+¥{res.sideSurcharge}</span></div>
                        ) : <div className="font-bold text-slate-500 italic uppercase">无附加费</div>}
                        <div className="pt-2 text-[9px] text-slate-400 font-mono leading-tight border-t border-slate-700 mt-2">{res.formula}</div>
                    </div>
                </div>
            </div>
        );

        const CarrierCard = ({ title, res, color, reg, pkgCount, isBest, isOptimized, originalCount }) => {
            const colorClasses = {
                indigo: { borderL: 'border-indigo-500', bg: 'bg-indigo-50/50', text: 'text-indigo-700', cost: 'text-indigo-800' },
                emerald: { borderL: 'border-emerald-500', bg: 'bg-emerald-50/50', text: 'text-emerald-700', cost: 'text-emerald-800' },
                rose: { borderL: 'border-rose-500', bg: 'bg-rose-50/50', text: 'text-rose-700', cost: 'text-rose-800' },
                cyan: { borderL: 'border-cyan-500', bg: 'bg-cyan-50/50', text: 'text-cyan-700', cost: 'text-cyan-800' },
                sky: { borderL: 'border-sky-500', bg: 'bg-sky-50/50', text: 'text-sky-700', cost: 'text-sky-800' },
                pink: { borderL: 'border-pink-500', bg: 'bg-pink-50/50', text: 'text-pink-700', cost: 'text-pink-800' },
                violet: { borderL: 'border-violet-500', bg: 'bg-violet-50/50', text: 'text-violet-700', cost: 'text-violet-800' },
                amber: { borderL: 'border-amber-500', bg: 'bg-amber-50/50', text: 'text-amber-700', cost: 'text-amber-800' },
                fuchsia: { borderL: 'border-fuchsia-500', bg: 'bg-fuchsia-50/50', text: 'text-fuchsia-700', cost: 'text-fuchsia-800' },
                teal: { borderL: 'border-teal-500', bg: 'bg-teal-50/50', text: 'text-teal-700', cost: 'text-teal-800' },
                blue: { borderL: 'border-blue-500', bg: 'bg-blue-50/50', text: 'text-blue-700', cost: 'text-blue-800' }
            }[color] || { borderL: 'border-slate-500', bg: 'bg-slate-50/50', text: 'text-slate-700', cost: 'text-slate-800' };

            return (
                <div className={`bg-white rounded-2xl shadow-sm border overflow-hidden flex relative transition-all ${isBest && !res.isError ? 'ring-2 ring-red-500 shadow-red-200 border-red-100' : 'border-slate-100'}`}>
                    {isBest && !res.isError && <div className="absolute top-0 right-0 bg-red-500 text-white text-[9px] font-black px-3 py-1 rounded-bl-lg uppercase z-10 shadow-md">最优惠</div>}
                    <div className={`w-[55%] p-4 flex flex-col justify-center border-l-4 ${colorClasses.borderL} ${res.isError ? 'bg-rose-50/50' : colorClasses.bg}`}>
                        <div className="flex items-center justify-between mb-2">
                            <span className={`font-black text-xs ${res.isError ? 'text-rose-700' : colorClasses.text}`}>{title}</span>
                            <span className={`opacity-60 text-[10px] ${res.isError ? 'text-rose-700' : colorClasses.text}`}>{reg}</span>
                        </div>
                        <div className={`font-black tracking-tighter ${res.isError ? 'text-rose-600 text-2xl' : 'text-3xl ' + colorClasses.cost}`}>
                            {res.isError ? res.errorMsg : `¥${res.totalCost.toFixed(1)}`}
                        </div>
                        <div className={`text-[10px] font-bold mt-1 opacity-70 ${res.isError ? 'text-rose-700' : colorClasses.text} flex flex-wrap gap-1 items-center`}>
                            {isOptimized ? <span className="bg-white/60 px-1 rounded text-emerald-700">{pkgCount}箱 (合箱自{originalCount}件)</span> : <span>{pkgCount}件</span>} 
                            <span>| 计费重: {res.bw}KG</span>
                        </div>
                    </div>
                    <div className={`w-[45%] p-4 flex flex-col justify-center bg-white border-l border-slate-100 ${res.isError ? 'text-rose-600' : ''}`}>
                        <div className="space-y-1 text-[10px]">
                            {res.sur.length > 0 ? res.sur.map((s, i) => (
                                <div key={i} className={`flex justify-between font-bold ${s.cost > 0 ? 'text-rose-500' : (res.isError ? 'text-rose-600' : 'text-slate-500')}`}>
                                    <span>{s.name}{s.count > 1 ? ` x${s.count}` : ''}</span>
                                    <span>{s.cost > 0 ? `+¥${s.cost}` : ''}</span>
                                </div>
                            )) : <div className="font-bold text-slate-300 italic uppercase">无附加费</div>}
                        </div>
                    </div>
                </div>
            );
        };

        const StatusItem = ({ label, val, ok }) => (
            <div className={`flex justify-between items-center px-4 py-3 rounded-xl border shadow-sm text-[10px] ${ok ? 'bg-white border-indigo-50' : 'bg-red-50 border-red-100'}`}>
                <span className="text-slate-400 uppercase font-black tracking-tight">{label}</span>
                <div className="flex items-center gap-2">
                    <span className={`font-black ${ok ? 'text-slate-800' : 'text-red-600'}`}>{val}</span>
                    <Icon name={ok ? "check-circle" : "x-circle"} className={`w-4 h-4 ${ok ? 'text-green-500' : 'text-red-500'}`} />
                </div>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
